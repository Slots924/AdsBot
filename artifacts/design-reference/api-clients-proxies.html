<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>API-клієнти та проксі — дизайн</title>
<style>
:root{color-scheme:dark;--bg:#0b0d15;--panel:#10121d;--card:#151823;--line:#292d3d;--muted:#858da5;--text:#edf0fa;--accent:#a99bff;--green:#43d3a0;--amber:#e4b96b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#1a1730 0,transparent 48%),var(--bg);font:13px 'Segoe UI',sans-serif;color:var(--text)}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default;color:#52596c;background:#141721;border-color:#232736}button svg{width:15px;height:15px}svg{fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
main{max-width:1064px;margin:42px auto;padding:0 20px}header.page{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--accent)}h1{font-size:25px;letter-spacing:-.6px;margin:7px 0 0;font-weight:650}.page-note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.page-note i{width:6px;height:6px;background:var(--green);border-radius:50%}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{min-width:0;border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#11131f,#0e1019);padding:20px;box-shadow:0 16px 50px #0002}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-title{display:flex;align-items:center;gap:9px}h2{font-size:16px;margin:0;font-weight:650}.count{font-size:11px;background:#25213e;color:#c1b7f6;padding:3px 7px;border-radius:6px}.icon{width:29px;height:29px;border:1px solid var(--line);border-radius:8px;background:#1b1e2b;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}.icon.danger{color:#dc7b86;background:transparent}.icon.launch{color:#a8ddca}.tabs{display:flex;gap:4px;padding:4px;background:#0b0d15;border:1px solid #242838;border-radius:10px;height:36px;margin-bottom:16px}.tabs button{border:0;flex:1;background:transparent;font-size:11px;color:#8e96ad;border-radius:6px}.tabs .active{color:#d9d2ff;background:#292341;font-weight:600}.right .tabs .active{background:#202c31;color:#acd6d4}
.list{display:grid;gap:10px}.card{height:136px;padding:13px 13px 0;border-radius:12px;border:1px solid #2a2d3b;background:var(--card);overflow:hidden}.card.selected{border-color:#7663c3;background:linear-gradient(125deg,#201d35,#171b2b);box-shadow:inset 3px 0 #9a85f2}.top{display:flex;align-items:center;gap:8px;min-height:20px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #43d3a00c;flex:none}.dot.error{background:#ef7387;box-shadow:0 0 0 4px #ef73870c}.dot.unknown{background:#778097;box-shadow:none}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{margin-left:auto;white-space:nowrap;border:1px solid #36413d;color:#9fd5bd;background:#1b2926;padding:2px 6px;border-radius:5px;font-size:10px}.badge.error{color:#e9ba80;border-color:#524231;background:#2d261f}.badge.unknown{color:#9aa3b9;border-color:#363b4a;background:#222633}.meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin:7px 0 0 15px;white-space:nowrap}.meta b{font-weight:400;color:#4c5368}.detail{height:18px;margin:6px 0 0 15px;font-size:11px;color:#9ba4ba;display:flex;align-items:center;gap:6px}.detail.warn{color:var(--amber)}.detail .tick{color:#8bc7ac}.detail .quiet{color:#646d83}.footer{display:flex;align-items:center;justify-content:space-between;gap:6px;height:42px;margin-top:9px;border-top:1px solid #ffffff08}.actions{display:flex;align-items:center;gap:5px}.token{height:26px;display:inline-flex;gap:2px;padding:2px;background:#0e1019;border:1px solid #2d3041;border-radius:7px;flex:none}.token button{width:74px;padding:0 4px;white-space:nowrap;border:0;background:transparent;border-radius:4px;font-size:10px;color:#929ab1}.token button.active{color:#e0d9ff;background:#332b50}.token button:disabled{color:#51586b}.public{display:flex;align-items:center;gap:6px;font-size:10px;color:#a1a9be}.switch{width:25px;height:14px;border-radius:9px;background:#8771e2;padding:2px;display:inline-flex;justify-content:flex-end}.switch:after{content:'';width:10px;height:10px;background:#fff;border-radius:50%}.switch.off{background:#303646;justify-content:flex-start}.switch.off:after{background:#9ca4b5}.drag{color:#576077;width:9px;font-size:15px;margin-left:-1px;margin-right:2px}.proxy .meta,.proxy .detail{margin-left:27px}.proxy .footer{margin-left:0}.proxy .badge{background:#1d2b30;color:#9bc9d4;border-color:#33434b}.add{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:37px;margin-top:14px;border:1px dashed #474061;border-radius:9px;background:#1b172c66;color:#c3b9ef;font-size:12px}.add svg{width:15px;height:15px}.footnote{display:flex;justify-content:space-between;margin-top:16px;color:#6e7890;font-size:11px}.legend{display:flex;gap:16px}.legend span{display:flex;align-items:center;gap:6px}.legend .dot{width:5px;height:5px}.subtle{color:#60697f}
.icon:disabled{color:#586074;background:#141721;border-color:#252a38;opacity:.45}</style></head><body><main>
<header class="page"><div><div class="eyebrow">ПІДКЛЮЧЕННЯ</div><h1>API-клієнти та проксі</h1></div><div class="page-note"><i></i>Локальний робочий простір</div></header>
<div class="workspace">
<section class="panel"><div class="panel-head"><div class="panel-title"><h2>API-клієнти</h2><span class="count">4</span></div><button class="icon" title="Оновити список" data-icon="refresh"></button></div>
<nav class="tabs"><button class="active">API-клієнти</button><button>BM</button><button>System Users</button></nav><div class="list" id="clients"></div><button class="add"><span data-icon="plus"></span>Додати API-клієнта</button></section>
<section class="panel right"><div class="panel-head"><div class="panel-title"><h2>Проксі</h2><span class="count">4</span></div><button class="icon" title="Оновити список" data-icon="refresh"></button></div>
<nav class="tabs"><button class="active">Усі</button><button>Публічні · 3</button><button>Приватні · 1</button></nav><div class="list" id="proxies"></div><button class="add"><span data-icon="plus"></span>Додати проксі</button></section>
</div><div class="footnote"><div class="legend"><span><i class="dot"></i>Активний</span><span><i class="dot error"></i>Помилка</span><span><i class="dot unknown"></i>Не перевірено</span></div><span class="subtle">Приклад дизайну · вигадані дані</span></div>
</main><script>
const paths={refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 13 3M18 18A8 8 0 0 1 5 15"/>',sync:'<path d="M7 17H6a4 4 0 0 1-1-8 7 7 0 0 1 13-1 4 4 0 0 1 0 9h-1M12 12v9m-3-3 3 3 3-3"/>',key:'<circle cx="8" cy="9" r="4"/><path d="m11 12 8 8 2-2-2-2 2-2-2-2-2 2"/>',play:'<path d="m8 5 11 7-11 7z"/>',power:'<path d="M12 3v9M7 5a8 8 0 1 0 10 0"/>',edit:'<path d="m15 4 5 5M4 20l4-1L21 6l-4-4L4 15z"/>',trash:'<path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
const icon=(id)=>`<svg viewBox="0 0 24 24">${paths[id]}</svg>`;
const btn=(id,label,disabled=false,extra='')=>`<button class="icon ${extra}" title="${label}" ${disabled?'disabled':''}>${icon(id)}</button>`;
const client=(name,id,profile,mode,error=false,selected=false,hasAfp=true)=>`<article class="card ${selected?'selected':''}"><div class="top"><i class="dot ${error?'error':''}"></i><span class="name">${name}</span><span class="badge ${error?'error':''}">${error?'Помилка':'Активний'}</span></div><div class="meta"><span>${id}</span><b>·</b><span>${profile?'AdsPower № '+profile:'Без AdsPower-профілю'}</span></div><div class="detail ${error?'warn':''}">${error?'⚠ Не вдалося завантажити застосунок':mode==='afp'?'<span class="tick">✓</span> AFP token <span class="quiet">· без cookie</span>':'<span class="tick">✓</span> UA · token · cookie'}</div><div class="footer"><div class="token"><button class="${mode==='access'?'active':''}">Access token</button><button class="${mode==='afp'?'active':''}" ${!hasAfp?'disabled':''}>AFP token</button></div><div class="actions">${btn('shield','Перевірити токен')}${btn('sync','Синхронізувати з AdsPower',!profile||mode==='afp')}${btn('key','Оновити через cookie',mode==='afp')}${btn('play',profile?'Відкрити профіль':'Спочатку вкажіть AdsPower-профіль',!profile,'launch')}${btn('edit','Редагувати')}${btn('trash','Видалити',false,'danger')}</div></div></article>`;
document.getElementById('clients').innerHTML=client('Основний клієнт','account-101','1201','access',false,true)+client('Клієнт для реклами','account-102','1202','access',true,false,false)+client('AFP-клієнт','account-103','1203','afp')+client('Новий клієнт','account-104','','access',false,false,false);
const proxy=(name,id,type,publicAccess,detail,status='active',api=false)=>`<article class="card proxy"><div class="top"><span class="drag">⠿</span><i class="dot ${status==='unknown'?'unknown':''}"></i><span class="name">${name}</span>${api?'<span class="badge">Пул API</span>':''}</div><div class="meta">${type}<b>·</b>AdsPower № ${id}</div><div class="detail">${status==='unknown'?'<span class="quiet">Ще не перевірено</span>':'<span class="tick">✓</span> '+detail}</div><div class="footer"><span class="public"><span class="switch ${publicAccess?'':'off'}"></span>${publicAccess?'Публічна':'Приватна'}</span><div class="actions">${btn('sync','Синхронізувати з AdsPower')}${btn('shield','Перевірити проксі')}${btn('refresh','Оновити IP',status==='unknown')}${btn('edit','Редагувати')}${btn('trash','Видалити',false,'danger')}</div></div></article>`;
document.getElementById('proxies').innerHTML=proxy('Основна проксі','5','SOCKS5',true,'З’єднання працює','active',true)+proxy('Коментарі','14','HTTP',true,'З’єднання працює')+proxy('Резервна проксі','18','SOCKS5',true,'З’єднання працює')+proxy('Без назви','19','HTTP',false,'','unknown');
document.querySelectorAll('[data-icon]').forEach((item)=>item.innerHTML=icon(item.dataset.icon));
</script></body></html>
